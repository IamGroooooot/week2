<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>간단한 웹 페이지</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #4f46e5;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #818cf8;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #818cf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 480px;
      padding: 32px 24px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 1.75rem; color: var(--accent); }
    p { margin: 0 0 20px; color: var(--muted); line-height: 1.6; }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #facc15;
      color: #1f2937;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    #count { margin-top: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <h1>안녕하세요 👋</h1>
    <p>간단한 웹 페이지입니다. 아래 버튼을 눌러 보세요.</p>
    <button id="btn">클릭 횟수: <span id="num">0</span></button>
    <div id="count"></div>
  </main>
  <script>
    let count = 0;
    const btn = document.getElementById("btn");
    const num = document.getElementById("num");
    btn.addEventListener("click", () => {
      count += 1;
      num.textContent = count;
    });
  </script>
</body>
</html>
